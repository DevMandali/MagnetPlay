syntax = "proto3";

package torrent;

// Option for Java
option java_multiple_files = true;
option java_package = "org.devMandali.magnetPlay";
option java_outer_classname = "TorrentProto";

// Option for Go
option go_package = "MagnetPlay/backend/proto;torrent";

service TorrentService {
  // Unary: resolve torrent info — call this before streaming
  rpc GetFileInfo(FileInfoRequest) returns (FileInfoResponse);

  // Unary: add a torrent magnet/file to the client
  rpc AddTorrent(TorrentRequest) returns (TorrentResponse);

  // Server-side streaming: stream file content chunk by chunk
  rpc StreamFile(StreamRequest) returns (stream FileChunk);

  // Unary: get download stats for a specific file (size, progress, speed)
  rpc GetTorrentStats(GetTorrentStatsRequest) returns (GetTorrentStatsResponse);

  rpc ListTorrents     (ListTorrentsRequest)      returns (ListTorrentsResponse);
  rpc PauseTorrent     (PauseTorrentRequest)      returns (PauseTorrentResponse);
  rpc ResumeTorrent    (ResumeTorrentRequest)     returns (ResumeTorrentResponse);
  rpc DeleteTorrent    (DeleteTorrentRequest)     returns (DeleteTorrentResponse);
}

// ─── FileInfo ──────────────────────────────────────────────────────────────

message FileInfoRequest {
  string info_hash = 1;
  string file_id = 2;
}

message FileInfoResponse {
  string file_name  = 1;
  string file_path  = 2;
  int64  total_size = 3;  // bytes
  string mime_type  = 4;
  bool   is_ready   = 5;  // true = torrent info resolved, safe to stream
}

// ─── AddTorrent ────────────────────────────────────────────────────────────

message TorrentRequest {
  string magnet_url  = 1;
}

enum TorrentStatus {
  NOT_FOUND = 0;
  SINGLE_FILE = 1;
  MULTI_FILE = 2;
  NON_VIDEO_FILE = 3;
}

message FileInfo {
  string id = 1;
  string name = 2;
  int64 size = 3;
}

message TorrentResponse {
  string torrent_id  = 1;
  string name = 2;
  TorrentStatus status = 3;
  repeated FileInfo files = 4;
}

// ─── StreamFile ───────────────────────────────────────────────────────────
message StreamRequest{
  string torrent_id  = 1;
  string file_id  = 2;
  int64  start_byte = 3;  // inclusive
  int64  end_byte   = 4;  // exclusive; -1 = stream to EOF
}

message FileChunk {
  bytes data     = 1;
  int64 offset   = 2;  // byte offset of this chunk within the file
  bool  is_last  = 3;
}

// ─── TorrentStats ─────────────────────────────────────────────────────────

message TorrentFileStats {
  string file_id            = 1;
  int64  total_size         = 2;
  int64  downloaded_bytes   = 3;
  double download_speed_bps = 4;  // rolling 5-second average, bytes/sec
  double completion_pct     = 5;
}

message GetTorrentStatsRequest {
  string info_hash = 1;
  string file_id   = 2;
}

message GetTorrentStatsResponse {
  TorrentFileStats stats = 1;
}

// ── Torrent state ─────────────────────────────────────────────
enum TorrentState {
  TORRENT_ACTIVE  = 0;
  TORRENT_PAUSED  = 1;
  TORRENT_STOPPED = 2;
}

// ── Management (F2i) ─────────────────────────────────────────
message TorrentListItem {
  string        torrent_id         = 1;
  string        name               = 2;
  TorrentStatus status             = 3;
  TorrentState  state              = 4;
  int64         total_size         = 5;
  int64         downloaded_bytes   = 6;
  double        completion_pct     = 7;
  double        download_speed_bps = 8;
  repeated FileInfo files          = 9;
}

message ListTorrentsRequest  {}
message ListTorrentsResponse { repeated TorrentListItem torrents = 1; }

message PauseTorrentRequest  { string info_hash = 1; }
message PauseTorrentResponse { bool success = 1; string message = 2; }

message ResumeTorrentRequest  { string info_hash = 1; }
message ResumeTorrentResponse { bool success = 1; string message = 2; }

message DeleteTorrentRequest  { string info_hash = 1; bool delete_files = 2; }
message DeleteTorrentResponse { bool success = 1; string message = 2; }